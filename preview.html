<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loader Preview — M Logo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 40px 20px;
    }

    header { text-align: center; }
    header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      opacity: .4;
    }

    .previews {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
      align-items: flex-end;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .card-label {
      font-size: .7rem;
      font-weight: 500;
      letter-spacing: .07em;
      text-transform: uppercase;
      opacity: .35;
    }

    .box {
      background: #FFE402;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 48px rgba(255,228,2,.2);
    }

    .box-lg  { width: 280px; height: 280px; border-radius: 20px; }
    .box-md  { width: 160px; height: 160px; border-radius: 14px; }
    .box-sm  { width: 80px;  height: 80px;  border-radius: 10px; }

    #l-lg  { width: 210px; height: 210px; }
    #l-md  { width: 116px; height: 116px; }
    #l-sm  { width: 58px;  height: 58px;  }

    /* Simulation pleine page */
    .sim-wrap {
      position: relative;
      width: 320px;
      height: 190px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.55);
    }

    .sim-bg {
      position: absolute;
      inset: 0;
      background: #2b2b2b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
    }

    .mock { background: rgba(255,255,255,.1); border-radius: 4px; height: 9px; }

    .sim-loader {
      position: absolute;
      inset: 0;
      background: #FFE402;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .5s ease;
    }

    .sim-loader.hidden { opacity: 0; pointer-events: none; }
    #l-sim { width: 110px; height: 110px; }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #2e2e2e;
      color: #fff;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      padding: 10px 22px;
      font-size: .85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    button:hover  { background: #3a3a3a; }
    button:active { transform: scale(.97); }
    button.yellow { background: #FFE402; color: #111; border-color: #FFE402; }
    button.yellow:hover { background: #f5db00; }

    /* Fullscreen real overlay */
    .fs-overlay {
      position: fixed;
      inset: 0;
      background: #FFE402;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s ease;
    }
    .fs-overlay.on  { opacity: 1; pointer-events: all; }
    .fs-overlay.off { opacity: 0; }
    #l-fs { width: 240px; height: 240px; }
  </style>
</head>
<body>

  <header><h1>Loader Preview — M Logo</h1></header>

  <div class="previews">

    <div class="card">
      <div class="box box-lg"><div id="l-lg"></div></div>
      <span class="card-label">Grande taille</span>
    </div>

    <div class="card">
      <div class="box box-md"><div id="l-md"></div></div>
      <span class="card-label">Medium</span>
    </div>

    <div class="card">
      <div class="box box-sm"><div id="l-sm"></div></div>
      <span class="card-label">Petite</span>
    </div>

    <div class="card">
      <div class="sim-wrap">
        <div class="sim-bg">
          <div class="mock" style="width:65%"></div>
          <div class="mock" style="width:80%"></div>
          <div class="mock" style="width:50%"></div>
          <div class="mock" style="width:72%"></div>
        </div>
        <div class="sim-loader" id="sim-loader">
          <div id="l-sim"></div>
        </div>
      </div>
      <span class="card-label">Simulation page</span>
    </div>

  </div>

  <div class="controls">
    <button class="yellow" onclick="launchFS()">Tester en plein écran</button>
    <button onclick="replaySim()">Rejouer simulation</button>
    <button onclick="togglePlay()">Pause / Play</button>
  </div>

  <!-- Real fullscreen overlay -->
  <div class="fs-overlay" id="fs-overlay">
    <div id="l-fs"></div>
  </div>

    // ── Helper ───────────────────────────────────────────────────────────────
    function make(id) {
      return lottie.loadAnimation({
        container: document.getElementById(id),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        animationData: LOTTIE_DATA
      });
    }

    const aLg  = make('l-lg');
    const aMd  = make('l-md');
    const aSm  = make('l-sm');
    const aSim = make('l-sim');
    const aFs  = make('l-fs');
    const all  = [aLg, aMd, aSm, aSim, aFs];

    let playing = true;

    // Auto-hide sim overlay
    function replaySim() {
      const el = document.getElementById('sim-loader');
      el.classList.remove('hidden');
      aSim.goToAndPlay(0, true);
      clearTimeout(window._t);
      window._t = setTimeout(() => el.classList.add('hidden'), 2800);
    }
    replaySim();

    // Real fullscreen
    function launchFS() {
      const el = document.getElementById('fs-overlay');
      aFs.goToAndPlay(0, true);
      el.classList.add('on');
      setTimeout(() => {
        el.classList.remove('on');
        el.classList.add('off');
        setTimeout(() => el.classList.remove('off'), 500);
      }, 3000);
    }

    // Pause / Play
    function togglePlay() {
      playing ? all.forEach(a => a.pause()) : all.forEach(a => a.play());
      playing = !playing;
    }
  </script>
</body>
</html>
